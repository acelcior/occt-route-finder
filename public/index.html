<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCCT Bus Planner</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="header">
          <h1>OCCT Bus Planner</h1>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>
        <div class="clock" id="clock"></div>
        <p class="muted">
          Places in the Binghamton area (campus, Vestal, Johnson City, etc.). Use a building name,
          business, or street — full street address optional.
        </p>
        <form id="route-form">
          <label for="from">From</label>
          <div class="autocomplete-wrapper">
            <input
              id="from"
              type="text"
              placeholder="e.g. CIW or Mountainview"
              list="stops-datalist"
              autocomplete="off"
              required
            />
            <ul id="from-suggestions" class="suggestions-list"></ul>
          </div>
          <label for="to">To</label>
          <div class="autocomplete-wrapper">
            <input
              id="to"
              type="text"
              placeholder="e.g. Maryam's Mart or Main St"
              list="stops-datalist"
              autocomplete="off"
              required
            />
            <ul id="to-suggestions" class="suggestions-list"></ul>
          </div>
          <button type="submit" id="submit-btn">Find Routes</button>
        </form>
        <p id="status" class="status"></p>
        <div id="results"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
